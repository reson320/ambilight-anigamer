name: 問題回報
description: 回報環境光的錯誤或怪異的顯示
title: "[問題] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 發生了什麼事？
      description: 描述你看到的問題，以及你原本預期的樣子。可以直接貼上截圖。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎麼重現？
      description: 例如：打開哪一部動畫的第幾集、切到劇院模式或全螢幕、調了哪些設定。
      placeholder: |
        1. 打開 https://ani.gamer.com.tw/animeVideo.php?sn=...
        2. 切換到劇院模式
        3. 環境光位置跑掉
  - type: input
    id: version
    attributes:
      label: 擴充功能版本
      description: 在 chrome://extensions 的「動畫瘋環境光」下方可以看到版本號
      placeholder: 1.0.0
  - type: dropdown
    id: browser
    attributes:
      label: 瀏覽器
      options:
        - Chrome
        - Edge
        - 其他
